version: '3.8'
services:
  edustar-db:
    container_name: edustar_sql_server
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    environment:
      - ACCEPT_EULA=Y
      # MẬT KHẨU PHẢI MẠNH (Nếu bạn để 123 là nó tự tắt ngay)
      - MSSQL_SA_PASSWORD=EduStar@2024!
      - MSSQL_PID=Express
    ports:
      # SỬA CỔNG: Map cổng 1434 của máy thật vào 1433 của Docker
      - "1434:1433"
    networks:
      - edustar-network

  # (Phần Redis giữ nguyên...)
  edustar-redis:
    container_name: edustar_redis
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - edustar-network

  edustar-minio:
    container_name: edustar_minio
    image: minio/minio:latest
    restart: always
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web UI
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - edustar-network

networks:
  edustar-network:
    driver: bridge